<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>endo's portfolio | status</title>
<meta name="description" content="Live status of my discord bots.">
<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="#313338">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%90%8D%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  /* Same tokens as the main page. Light is the base; dark follows the system setting. */
  :root {
    --bg: #ffffff;
    --panel: #f2f3f5;
    --sunken: #e3e5e8;
    --btn: #f2f3f5;
    --btn-hover: #e3e5e8;
    --text: #060607;
    --text-2: #313338;
    --muted: #5c5e66;
    --line: #d1d3d7;
    --blurple: #5865f2;
    --link: #0067e0;

    color-scheme: light dark;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #313338;
      --panel: #2b2d31;
      --sunken: #1e1f22;
      --btn: #2b2d31;
      --btn-hover: #35373c;
      --text: #f2f3f5;
      --text-2: #dbdee1;
      --muted: #a3a6ad;
      --line: #3f4147;
      --link: #00a8fc;
    }
  }
  :root[data-theme="dark"] {
    --bg: #313338;
    --panel: #2b2d31;
    --sunken: #1e1f22;
    --btn: #2b2d31;
    --btn-hover: #35373c;
    --text: #f2f3f5;
    --text-2: #dbdee1;
    --muted: #a3a6ad;
    --line: #3f4147;
    --link: #00a8fc;
  }

  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  *, *::before, *::after { box-sizing: inherit; }
  [hidden] { display: none !important; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text-2);
    font-family: "Plus Jakarta Sans", "Helvetica Neue", Helvetica, Arial, sans-serif;
    font-size: 16px;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
  }
  a { color: var(--link); }
  :focus-visible { outline: 2px solid var(--link); outline-offset: 2px; }

  .wrap { max-width: 720px; margin: 0 auto; padding: 32px 16px 48px; }

  .crumb {
    display: flex;
    align-items: center;
    gap: 8px;
    margin: 0 0 16px 2px;
    color: var(--muted);
    font-size: 15px;
    font-weight: 600;
  }
  .crumb a { color: var(--text); text-decoration: none; }
  .crumb a:hover { text-decoration: underline; }

  .container {
    --pad-y: 16px;
    --pad-x: 20px;
    padding: var(--pad-y) var(--pad-x);
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 8px;
  }
  .container + .container { margin-top: 16px; }
  .sep { height: 1px; margin: 16px 0; border: 0; background: var(--line); }

  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    min-height: 36px;
    padding: 6px 14px;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: var(--btn);
    color: var(--text);
    font-family: inherit;
    font-size: 14px;
    font-weight: 700;
    line-height: 1.2;
    text-decoration: none;
    cursor: pointer;
    transition: background-color 0.15s;
  }
  .btn:hover { background: var(--btn-hover); }
  .btn:disabled { opacity: 0.6; cursor: default; }
  .container .btn { background: var(--sunken); }
  .container .btn:hover { background: var(--line); }

  /* ---------- summary ---------- */
  .summary { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
  .summary-main { display: flex; align-items: center; gap: 14px; min-width: 0; }
  .big-dot { width: 16px; height: 16px; flex: none; border-radius: 50%; background: var(--dot, var(--muted)); }
  .summary h1 {
    margin: 0;
    color: var(--text);
    font-size: clamp(24px, 5.5vw, 32px);
    font-weight: 800;
    letter-spacing: -0.02em;
    line-height: 1.2;
  }
  .summary p { margin: 2px 0 0; color: var(--muted); font-size: 14px; }

  /* ---------- bot rows ---------- */
  .head h2 { margin: 0; color: var(--text); font-size: 20px; font-weight: 800; line-height: 1.25; }
  .head p { margin: 4px 0 0; color: var(--muted); font-size: 15px; }

  .row { display: flex; align-items: center; flex-wrap: wrap; gap: 8px 14px; }
  .thumb {
    display: grid;
    place-items: center;
    flex: none;
    width: 48px;
    height: 48px;
    border-radius: 12px;
    overflow: hidden;
    background: var(--accent, var(--blurple));
    color: #fff;
    font-size: 20px;
    font-weight: 800;
    line-height: 1;
  }
  .thumb > img { display: block; width: 100%; height: 100%; object-fit: cover; }
  .info { flex: 1 1 160px; min-width: 0; }
  .info h3 { margin: 0; color: var(--text); font-size: 16px; font-weight: 700; line-height: 1.3; overflow-wrap: anywhere; }
  .info p { margin: 0; color: var(--muted); font-size: 13px; font-weight: 600; }

  .state {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 4px 12px 4px 10px;
    border-radius: 6px;
    background: var(--sunken);
    color: var(--text);
    font-size: 13px;
    font-weight: 700;
    white-space: nowrap;
  }
  .state i { width: 10px; height: 10px; border-radius: 50%; background: var(--dot, var(--muted)); flex: none; }

  footer { margin-top: 32px; color: var(--muted); font-size: 13px; }
  footer p { margin: 0 0 2px 2px; }

  @media (max-width: 520px) {
    .container { --pad-y: 14px; --pad-x: 16px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .btn { transition: none; }
  }
</style>
</head>
<body>
<div class="wrap">
  <main>
    <nav class="crumb" aria-label="Breadcrumb"><a href="/">endo</a><span aria-hidden="true">/</span><span>status</span></nav>

    <section class="container summary" aria-live="polite" aria-label="Overall status">
      <div class="summary-main">
        <span class="big-dot" id="sum-dot" aria-hidden="true"></span>
        <div>
          <h1 id="sum-title">Checking status</h1>
          <p id="sum-sub">One moment.</p>
        </div>
      </div>
      <button class="btn" id="refresh" type="button">Refresh</button>
    </section>

    <section class="container" aria-labelledby="bots-title">
      <div class="head">
        <h2 id="bots-title">Bots</h2>
        <p>Whether each of my Discord bots is online right now.</p>
      </div>
      <hr class="sep">
      <div id="rows"></div>
    </section>
  </main>

  <footer>
    <p id="foot-note">Checked again every minute.</p>
    <p>Not affiliated with Discord. Discord is a trademark of Discord Inc.</p>
  </footer>
</div>

<script>
/* =====================================================================
   EDIT YOUR SETTINGS HERE.
   ===================================================================== */

const BOTS = [
  { id: "1546578107316703272", name: "ilyn payne",          accent: "#0a8ac9" },
  { id: "1530859912513458246", name: "Lore division",       accent: "#1f9d55" },
  { id: "1525243868352745512", name: "Moderation division", accent: "#5865f2" }
  // If a bot always shows as offline while it is up, add  widgetName: "its exact name in the server"
];

/* How the status is found: Discord's server widget lists who is online in a server.
   1. Put the ID of a server that your bots are in below (a few IDs is fine).
   2. In that server: Server Settings > Widget > Enable Server Widget.
   Each bot then shows as Online, Idle or Do not disturb when it is in the list, and Offline when it isn't. */
const STATUS_SERVER_IDS = [
    "1536699364850933780"
  // "123456789012345678"
];

const REFRESH_SECONDS = 60;

/* Add ?demo to the address to preview the page with sample statuses. */
const DEMO = new URLSearchParams(location.search).has("demo");

/* ===================== code (no need to edit) ===================== */

const DISCORD_API = "https://discord.com/api/v10/";
const LOOKUP_USER = "https://discordlookup.mesalytic.moe/v1/user/";   // public lookup for names and profile pictures
const CACHE_MINUTES = 10;

// ---- pure helpers ----
function sized(url, size) {
  if (!url) return null;
  return url.includes("?") ? url : url + "?size=" + size;
}

function parseLookup(d) {
  if (!d || typeof d !== "object") return {};
  const tagName = d.tag ? String(d.tag).split("#")[0] : null;
  const username = d.username || (d.raw && d.raw.username) || tagName || null;
  return {
    name: d.global_name || (d.raw && d.raw.global_name) || username || null,
    username,
    avatar: sized(d.avatar && d.avatar.link, 128)
  };
}

function parseRpc(d, id) {
  if (!d || typeof d !== "object") return {};
  return {
    name: d.name || null,
    avatar: d.icon ? "https://cdn.discordapp.com/app-icons/" + id + "/" + d.icon + ".png?size=128" : null
  };
}

const STATES = {
  online:  { label: "Online",         color: "#23a55a" },
  idle:    { label: "Idle",           color: "#f0b232" },
  dnd:     { label: "Do not disturb", color: "#f23f43" },
  offline: { label: "Offline",        color: "#80848e" },
  unknown: { label: "Unknown",        color: "#80848e" }
};
const SUMMARY_COLORS = { online: "#23a55a", partial: "#f0b232", offline: "#f23f43", unknown: "#80848e" };

// The widget only lists members that are online, so a bot that isn't listed counts as offline.
function pickStatus(members, names) {
  if (!Array.isArray(members)) return null;
  const wanted = names.filter(Boolean).map(n => String(n).toLowerCase());
  const m = members.find(x => wanted.includes(String(x.username || "").toLowerCase()));
  return m && STATES[m.status] ? m.status : "offline";
}

function summarize(states) {
  const total = states.length;
  const unknown = states.filter(s => s === "unknown").length;
  const offline = states.filter(s => s === "offline").length;
  if (unknown === total) return { key: "unknown", title: "Status unavailable" };
  if (offline === total) return { key: "offline", title: total === 1 ? "The bot is offline" : "All bots are offline" };
  if (offline > 0) return { key: "partial", title: offline + " of " + total + (offline === 1 ? " bot is offline" : " bots are offline") };
  if (unknown > 0) return { key: "partial", title: "Some statuses are unavailable" };
  return { key: "online", title: total === 1 ? "The bot is online" : "All bots are online" };
}
// ---- end pure helpers ----

async function getJSON(url, ms = 6000) {
  const ctl = new AbortController();
  const timer = setTimeout(() => ctl.abort(), ms);
  try {
    const res = await fetch(url, { signal: ctl.signal });
    if (!res.ok) throw new Error("HTTP " + res.status);
    return await res.json();
  } finally {
    clearTimeout(timer);
  }
}

function cacheGet(key, maxAgeMs) {
  try {
    const raw = localStorage.getItem(key);
    if (!raw) return null;
    const o = JSON.parse(raw);
    return { data: o.data, fresh: Date.now() - o.t < maxAgeMs };
  } catch (e) { return null; }
}
function cacheSet(key, data) {
  try { localStorage.setItem(key, JSON.stringify({ t: Date.now(), data })); } catch (e) { /* storage unavailable */ }
}

// Name and profile picture. Shares its cache with the main page.
async function fetchBotInfo(id) {
  const key = "endo:bot:" + id;
  const cached = cacheGet(key, CACHE_MINUTES * 60000);
  if (cached && cached.fresh) return cached.data;

  const [rpc, user] = await Promise.allSettled([
    getJSON(DISCORD_API + "applications/" + id + "/rpc"),
    getJSON(LOOKUP_USER + id)
  ]);
  const r = rpc.status === "fulfilled" ? parseRpc(rpc.value, id) : {};
  const u = user.status === "fulfilled" ? parseLookup(user.value) : {};
  const info = {
    name: u.name || r.name || null,
    username: u.username || r.name || null,
    avatar: u.avatar || r.avatar || null
  };
  if (Object.values(info).some(Boolean)) {
    const previous = cached && cached.data ? cached.data : {};
    cacheSet(key, Object.assign({}, previous, info));
    return info;
  }
  return cached ? cached.data : null;
}

function h(tag, props = {}, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(props)) {
    if (v == null || v === false) continue;
    if (k === "class") el.className = v;
    else if (k === "text") el.textContent = v;
    else el.setAttribute(k, v);
  }
  for (const kid of kids.flat()) {
    if (kid == null || kid === false) continue;
    el.append(kid.nodeType ? kid : document.createTextNode(kid));
  }
  return el;
}

function setAvatar(thumb, url, alt) {
  const img = new Image();
  img.alt = alt || "";
  img.addEventListener("load", () => { thumb.replaceChildren(img); });
  img.src = url;
}

const infos = {};   // bot id -> { name, username, avatar }
const rows = {};    // bot id -> { name, thumb, dot, label }

function renderRows() {
  const root = document.getElementById("rows");
  BOTS.forEach((b, i) => {
    if (i > 0) root.append(h("hr", { class: "sep" }));
    const thumb = h("div", { class: "thumb", "aria-hidden": "true", text: b.name.charAt(0).toUpperCase() });
    thumb.style.setProperty("--accent", b.accent || "#5865f2");
    const name = h("h3", { text: b.name });
    const dot = h("i", { "aria-hidden": "true" });
    const label = h("span", { text: "Checking" });
    rows[b.id] = { name, thumb, dot, label };
    root.append(h("div", { class: "row" },
      thumb,
      h("div", { class: "info" }, name, h("p", { text: "Discord bot" })),
      h("span", { class: "state" }, dot, label)
    ));
  });
}

async function loadInfo() {
  await Promise.all(BOTS.map(async b => {
    const info = DEMO ? null : await fetchBotInfo(b.id).catch(() => null);
    if (!info) return;
    infos[b.id] = info;
    const row = rows[b.id];
    if (info.name) { row.name.textContent = info.name; row.thumb.textContent = info.name.charAt(0).toUpperCase(); }
    if (info.avatar) setAvatar(row.thumb, info.avatar, (info.name || b.name) + " profile picture");
  }));
}

const DEMO_STATES = ["online", "idle", "offline"];
let busy = false;

async function refresh() {
  if (busy) return;
  busy = true;
  const btn = document.getElementById("refresh");
  btn.disabled = true;
  btn.textContent = "Checking";

  let states;
  let sourcesLoaded = 0;
  if (DEMO) {
    states = BOTS.map((b, i) => DEMO_STATES[i % DEMO_STATES.length]);
  } else {
    const members = [];
    if (STATUS_SERVER_IDS.length === 0) {
      console.warn("Status page: add a server ID to STATUS_SERVER_IDS so bot status can be checked.");
    } else {
      const results = await Promise.allSettled(
        STATUS_SERVER_IDS.map(id => getJSON(DISCORD_API + "guilds/" + id + "/widget.json"))
      );
      results.forEach(r => {
        if (r.status === "fulfilled" && r.value && Array.isArray(r.value.members)) {
          sourcesLoaded++;
          members.push(...r.value.members);
        }
      });
    }
    states = BOTS.map(b => {
      if (sourcesLoaded === 0) return "unknown";
      const info = infos[b.id] || {};
      return pickStatus(members, [b.widgetName, info.username, info.name, b.name]);
    });
  }

  BOTS.forEach((b, i) => {
    const s = STATES[states[i]] || STATES.unknown;
    rows[b.id].dot.style.setProperty("--dot", s.color);
    rows[b.id].label.textContent = s.label;
  });

  const sum = summarize(states);
  document.getElementById("sum-dot").style.setProperty("--dot", SUMMARY_COLORS[sum.key]);
  document.getElementById("sum-title").textContent = sum.title;
  document.getElementById("sum-sub").textContent = sum.key === "unknown"
    ? "Couldn't check the bots just now. Try again in a moment."
    : "Updated at " + new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit", second: "2-digit" });
  document.getElementById("foot-note").textContent = DEMO
    ? "Sample statuses. Remove ?demo from the address to see the real ones."
    : "Checked again every " + REFRESH_SECONDS + " seconds.";

  btn.textContent = "Refresh";
  btn.disabled = false;
  busy = false;
}

renderRows();
document.getElementById("refresh").addEventListener("click", refresh);
loadInfo().then(refresh);
setInterval(() => { if (!document.hidden) refresh(); }, REFRESH_SECONDS * 1000);
</script>
</body>
</html>
